server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API routes to the backend container
    # In Docker Compose, the backend is reachable by its service name: ds2-ddt
    location /configs {
        proxy_pass http://ds2-ddt:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /profiling/ {
        proxy_pass http://ds2-ddt:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
