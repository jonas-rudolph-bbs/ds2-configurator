server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API routes to the backend, so the browser only talks to this origin
    # (no second certificate, no CORS, no local network access prompts).
    # In Kubernetes, the backend Service "ds2ddtbackend" is in the same namespace.
    location /configs/ {
        proxy_pass http://ds2ddtbackend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /profiling/profile/ {
        proxy_pass http://ds2ddtbackend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;   # uploaded sample data
        proxy_read_timeout 300s;    # profiling can be slow
    }

    # SPA fallback: all other routes (incl. /configurations, /profiling) serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}